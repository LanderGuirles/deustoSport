spring.application.name=my-app
spring.datasource.url=${DB_URL:jdbc:h2:file:${user.home}/deustosport_app;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=on_param
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.port=8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Email Configuration (Recuperación de Contraseña)
# Por defecto deshabilitado (usa simulación en consola)
# Para habilitar email real, configura las propiedades y establece app.email.enabled=true
app.email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Pasarela de pago externa (desactivada por defecto)
payment.gateway.enabled=${PAYMENT_GATEWAY_ENABLED:false}
payment.gateway.base-url=${PAYMENT_GATEWAY_BASE_URL:http://localhost:9090}
payment.gateway.validate-path=${PAYMENT_GATEWAY_VALIDATE_PATH:/api/payments/validate}
payment.gateway.api-key=${PAYMENT_GATEWAY_API_KEY:}

# QR Code Storage
qr.storage.path=${QR_STORAGE_PATH:qrcodes}

# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE CORS (Cross-Origin Resource Sharing)
# ═══════════════════════════════════════════════════════════════════════════════
# Orígenes permitidos para peticiones CORS
# En desarrollo: localhost:8081, localhost:3000 (para herramientas como React)
# En producción: especificar dominio exacto (ej: https://www.deustosport.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000,http://localhost:4200}

# Métodos HTTP permitidos en peticiones CORS
# GET: lectura de datos
# POST: creación de recursos
# PUT: actualización completa
# DELETE: eliminación
# PATCH: actualización parcial
# OPTIONS: preflight requests
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}

# Tiempo máximo que el navegador cachea el preflight response (segundos)
# 3600 = 1 hora (recomendado para reducir tráfico)
app.cors.max-age=${CORS_MAX_AGE:3600}

# Entorno de ejecución
# Valores soportados: development, testing, production
# En production, CORS será más restrictivo
app.environment=${APP_ENVIRONMENT:development}