<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Secretaria - Busqueda de Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
    <script>
        const currentUserId = localStorage.getItem('usuarioId');
        const currentUserRol = (localStorage.getItem('usuarioRol') || '').trim().toUpperCase();
        const allowedSecretariaRoles = ['SECRETARIA', 'SECRETARIO'];

        if (!currentUserId || !allowedSecretariaRoles.includes(currentUserRol)) {
            window.location.replace('login.html');
        }
    </script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1e242e;
            --border: #30363d;
            --accent: #00e5a0;
            --accent2: #00b37e;
            --accent-dim: rgba(0,229,160,0.12);
            --warn: #f0a500;
            --danger: #f85149;
            --success: #3fb950;
            --text: #e6edf3;
            --muted: #7d8590;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .layout {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            background: radial-gradient(ellipse 60% 40% at 0% 0%, rgba(0,229,160,.08) 0%, transparent 70%);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .session-user {
            font-size: 14px;
            color: var(--muted);
        }

        .session-user strong {
            color: var(--text);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 30px;
            letter-spacing: -0.3px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .field label {
            display: block;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px;
            color: var(--muted);
        }

        .field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }

        .field input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            transition: all .2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #0d1117;
        }

        .btn-primary:hover {
            background: var(--accent2);
        }

        .btn-secondary {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(0,229,160,.35);
        }

        .btn-secondary:hover {
            background: rgba(0,229,160,.2);
        }

        .btn-logout {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-logout:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status {
            margin-top: 12px;
            font-size: 14px;
            color: var(--muted);
            min-height: 20px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
        }

        .status.error {
            color: var(--danger);
            border-color: rgba(248,81,73,.35);
            background: rgba(248,81,73,.12);
        }

        .grid {
            margin-top: 20px;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            vertical-align: top;
        }

        th {
            background: var(--surface2);
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: .4px;
        }

        .reserva-box {
            margin-top: 18px;
            border-top: 1px dashed var(--border);
            padding-top: 16px;
        }

        .tag {
            font-weight: 700;
            color: var(--accent);
        }

        @media (max-width: 640px) {
            .layout {
                padding: 20px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .card {
                padding: 16px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
<div class="layout">
    <div class="header">
        <div>
            <h1>Panel de Secretaria</h1>
            <p class="subtitle">Busca usuarios por DNI y consulta sus reservas de forma rapida.</p>
        </div>
        <div class="header-actions">
            <span class="session-user">Sesion: <strong id="sessionUser">-</strong></span>
            <button class="btn-logout" id="cerrarSesionBtn">Cerrar sesion</button>
        </div>
    </div>

    <section class="card">
        <div class="filters">
            <div class="field">
                <label for="dni">Filtrar por DNI</label>
                <input id="dni" type="text" placeholder="Ej: 11111111A">
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="buscarBtn">Buscar</button>
            <button class="btn-secondary" id="limpiarBtn">Limpiar filtros</button>
            <button class="btn-secondary" id="exportarHoyBtn">Exportar reservas de hoy (CSV)</button>
        </div>

        <div class="status" id="status"></div>

        <div class="grid">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Email</th>
                    <th>Telefono</th>
                    <th>Reservas</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="usuariosBody">
                <tr><td colspan="7">Introduce un filtro y pulsa "Buscar".</td></tr>
                </tbody>
            </table>
        </div>

        <div class="reserva-box" id="reservasBox" style="display:none;">
            <p><span class="tag">Reservas del usuario:</span> <span id="usuarioReservaLabel"></span></p>
            <div class="grid">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Hora Inicio</th>
                        <th>Hora Fin</th>
                        <th>Estado</th>
                        <th>Pista</th>
                    </tr>
                    </thead>
                    <tbody id="reservasBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<script>
    const sessionUserEl = document.getElementById("sessionUser");
    const sessionUserName = localStorage.getItem("usuarioNombre") || "Secretaria";
    sessionUserEl.textContent = sessionUserName;

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    document.getElementById("cerrarSesionBtn").addEventListener("click", logout);

    const statusEl = document.getElementById("status");
    const usuariosBody = document.getElementById("usuariosBody");
    const reservasBody = document.getElementById("reservasBody");
    const reservasBox = document.getElementById("reservasBox");
    const usuarioReservaLabel = document.getElementById("usuarioReservaLabel");

    function setStatus(text, isError = false) {
        statusEl.textContent = text || "";
        statusEl.classList.toggle("error", Boolean(isError));
    }

    function buildSearchQuery() {
        const dni = document.getElementById("dni").value.trim();
        const params = new URLSearchParams();

        if (dni) {
            params.append("dni", dni);
        }
        return params.toString();
    }

    async function buscarUsuarios() {
        setStatus("Buscando usuarios...");
        reservasBox.style.display = "none";
        const query = buildSearchQuery();

        try {
            const response = await fetch(`http://localhost:8080/api/secretaria/usuarios${query ? `?${query}` : ""}`);
            if (!response.ok) {
                throw new Error("No se pudo obtener la lista de usuarios.");
            }

            const data = await response.json();
            renderUsuarios(data);
            setStatus(`Se encontraron ${data.length} usuario(s).`);
        } catch (error) {
            renderUsuarios([]);
            setStatus(error.message, true);
        }
    }

    function renderUsuarios(usuarios) {
        if (!usuarios.length) {
            usuariosBody.innerHTML = '<tr><td colspan="7">No hay usuarios que coincidan con los filtros.</td></tr>';
            return;
        }

        usuariosBody.innerHTML = usuarios.map((usuario) => `
            <tr>
                <td>${usuario.id}</td>
                <td>${usuario.nombreCompleto ?? "-"}</td>
                <td>${usuario.dni ?? "-"}</td>
                <td>${usuario.email ?? "-"}</td>
                <td>${usuario.telefono ?? "-"}</td>
                <td>${usuario.totalReservas}</td>
                <td>
                    <button class="btn-secondary" onclick="verReservas(${usuario.id}, '${(usuario.nombreCompleto || '').replace(/'/g, "\\'")}')">
                        Ver reservas
                    </button>
                </td>
            </tr>
        `).join("");
    }

    async function verReservas(usuarioId, nombreCompleto) {
        setStatus("Consultando reservas del usuario...");
        try {
            const response = await fetch(`http://localhost:8080/api/secretaria/usuarios/${usuarioId}/reservas`);
            if (!response.ok) {
                throw new Error("No se pudieron cargar las reservas.");
            }

            const data = await response.json();
            usuarioReservaLabel.textContent = `${nombreCompleto} (ID ${usuarioId})`;
            reservasBox.style.display = "block";
            renderReservas(data);
            setStatus(`Reservas cargadas: ${data.length}.`);
        } catch (error) {
            reservasBox.style.display = "none";
            setStatus(error.message, true);
        }
    }

    async function exportarReservasHoyCsv() {
        const exportarBtn = document.getElementById("exportarHoyBtn");
        exportarBtn.disabled = true;
        setStatus("Generando archivo CSV con las reservas de hoy...");

        try {
            const response = await fetch("http://localhost:8080/api/secretaria/reservas/hoy/exportar");
            if (!response.ok) {
                throw new Error("No se pudo generar el CSV de reservas de hoy.");
            }

            const blob = await response.blob();
            const disposition = response.headers.get("content-disposition") || "";
            const filenameMatch = disposition.match(/filename="?([^\"]+)"?/i);
            const filename = filenameMatch ? filenameMatch[1] : `reservas_hoy_${new Date().toISOString().slice(0, 10)}.csv`;

            const downloadUrl = window.URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = downloadUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(downloadUrl);

            setStatus("CSV generado y descargado correctamente.");
        } catch (error) {
            setStatus(error.message || "Error al exportar reservas.", true);
        } finally {
            exportarBtn.disabled = false;
        }
    }

    function renderReservas(reservas) {
        if (!reservas.length) {
            reservasBody.innerHTML = '<tr><td colspan="6">Este usuario no tiene reservas.</td></tr>';
            return;
        }

        reservasBody.innerHTML = reservas.map((reserva) => `
            <tr>
                <td>${reserva.id}</td>
                <td>${reserva.fecha}</td>
                <td>${reserva.horaInicio}</td>
                <td>${reserva.horaFin}</td>
                <td>${reserva.estado}</td>
                <td>${reserva.pistaNombre}</td>
            </tr>
        `).join("");
    }

    document.getElementById("buscarBtn").addEventListener("click", buscarUsuarios);
    document.getElementById("exportarHoyBtn").addEventListener("click", exportarReservasHoyCsv);

    document.getElementById("limpiarBtn").addEventListener("click", () => {
        document.getElementById("dni").value = "";
        usuariosBody.innerHTML = '<tr><td colspan="7">Introduce un filtro y pulsa "Buscar".</td></tr>';
        reservasBox.style.display = "none";
        setStatus("");
    });

    window.verReservas = verReservas;
</script>
</body>
</html>
